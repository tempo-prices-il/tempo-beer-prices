name: Refresh retailer price and promotion feeds
on:
  schedule:
    - cron: '17 2 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/refresh-feeds.py
      - run: |
          git config user.name "tempo-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "Daily retailer price and promotion refresh"
          git push
