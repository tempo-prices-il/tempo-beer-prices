name: Install persistent verified override pipeline
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pipeline files
        run: |
          echo '' | base64 -d > scripts/build-from-feeds.py
          echo '' | base64 -d > scripts/verified-overrides.json
          python -m py_compile scripts/build-from-feeds.py
          python - <<'PY'
          import json
          x=json.load(open('scripts/verified-overrides.json'))
          assert len(x)==50
          assert sum(o['row'].get('sourceLabel')=='מקור: CHP' for o in x)==33
          PY
      - run: |
          git config user.name tempo-price-bot
          git config user.email actions@users.noreply.github.com
          git add scripts/build-from-feeds.py scripts/verified-overrides.json
          git diff --cached --quiet || git commit -m 'Persist verified overrides in refresh pipeline'
          git push
