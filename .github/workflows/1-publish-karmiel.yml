name: Publish validated Karmiel rows
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Merge exact Shufersal rows
        run: |
          python - <<'PY'
          import json,datetime
          p='docs/data.json';d=json.load(open(p));by={x['barcode']:x for x in d['areas']['כרמיאל']}
          rows=[{'barcode': '7290008464741', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '36.90', 'promoPrice': '32.50', 'promo': '2 יחידות ב- 65.00 ש"ח · (מחיר ליחידה 32.50 ש"ח)', 'promoStart': None, 'promoEnd': '2026-10-03', 'promoQty': 2.0, 'promoTotal': '65.00', 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290006764072', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '8.00', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464468', 'chain': 'שופרסל', 'store': 'כרמיאל', 'address': 'ההגנה 2, כרמיאל', 'price': '9.90', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464130', 'chain': 'שופרסל', 'store': 'כרמיאל', 'address': 'ההגנה 2, כרמיאל', 'price': '39.90', 'promoPrice': '30.00', 'promo': '2 יחידות ב- 60.00 ש"ח · (מחיר ליחידה 30.00 ש"ח)', 'promoStart': None, 'promoEnd': '2026-10-03', 'promoQty': 2.0, 'promoTotal': '60.00', 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464796', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '39.90', 'promoPrice': '37.90', 'promo': '37.90 ש"ח ליחידה', 'promoStart': None, 'promoEnd': '2026-10-03', 'promoQty': 1.0, 'promoTotal': '37.90', 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464604', 'chain': 'שופרסל', 'store': 'כרמיאל', 'address': 'ההגנה 2, כרמיאל', 'price': '12.90', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290010237890', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '10.00', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464475', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '9.90', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290008464222', 'chain': 'שופרסל', 'store': 'כרמיאל', 'address': 'ההגנה 2, כרמיאל', 'price': '9.90', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290005896453', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '8.00', 'promoPrice': None, 'promo': None, 'promoStart': None, 'promoEnd': None, 'promoQty': None, 'promoTotal': None, 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '7290006764096', 'chain': 'שופרסל', 'store': 'כרמיאל- קניון לב', 'address': 'מורד הגיא 100, כרמיאל', 'price': '7.00', 'promoPrice': '5.67', 'promo': '3 יחידות ב- 17.00 ש"ח · (מחיר ליחידה 5.67 ש"ח)', 'promoStart': None, 'promoEnd': '2026-10-03', 'promoQty': 3.0, 'promoTotal': '17.00', 'source': 'https://prices.shufersal.co.il/'}, {'barcode': '4066600601920', 'chain': 'שופרסל', 'store': 'כרמיאל', 'address': 'ההגנה 2, כרמיאל', 'price': '12.90', 'promoPrice': '12.00', 'promo': '2 יחידות ב- 24.00 ש"ח · (מחיר ליחידה 12.00 ש"ח)', 'promoStart': None, 'promoEnd': '2026-10-03', 'promoQty': 2.0, 'promoTotal': '24.00', 'source': 'https://prices.shufersal.co.il/'}]
          for row in rows:
            c=row.pop('barcode')
            if any(r['chain']==row['chain'] and r['store']==row['store'] for r in by[c]['prices']): continue
            by[c]['prices'].append(row);by[c]['prices'].sort(key=lambda r:(float(r.get('promoPrice') or r['price']),r['chain'],r['store']))
          got=[r for x in d['areas']['כרמיאל'] for r in x['prices'] if r['chain']=='שופרסל']
          assert len(got)==12 and all(r['address'] in ('מורד הגיא 100, כרמיאל','ההגנה 2, כרמיאל') for r in got)
          d['updatedAt']=datetime.datetime.now().astimezone().isoformat();json.dump(d,open(p,'w'),ensure_ascii=False,indent=2)
          PY
      - run: |
          git config user.name tempo-price-bot
          git config user.email actions@users.noreply.github.com
          git add docs/data.json
          git diff --cached --quiet || git commit -m 'Add validated Shufersal Karmiel prices'
          git push
