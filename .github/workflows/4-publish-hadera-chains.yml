name: Publish verified Hadera chain data
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/4-publish-hadera-chains.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified files
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/update.tgz
          tar -xzf /tmp/update.tgz
          python -m json.tool docs/data.json >/dev/null
          python -m json.tool scripts/verified-overrides.json >/dev/null
          python -m py_compile scripts/build-from-feeds.py scripts/refresh-feeds.py
      - name: Publish
        run: |
          git config user.name tempo-price-bot
          git config user.email actions@users.noreply.github.com
          git add docs/data.json scripts/build-from-feeds.py scripts/refresh-feeds.py scripts/verified-overrides.json
          git diff --cached --quiet || git commit -m "Publish verified Hadera Carrefour, Keshet and Shuk HaIr prices"
          git push
