<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>מחירי בירות טמפו</title><style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--red:#d71920;--green:#057a55;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Noto Sans Hebrew",sans-serif}header{background:linear-gradient(135deg,#111827,#303847);color:#fff;padding:22px 16px 18px;position:sticky;top:0;z-index:2;box-shadow:0 2px 12px #0003}.wrap{max-width:980px;margin:auto}h1{font-size:24px;margin:0 0 7px}.meta select{background:#fff;color:#111827;border:0;border-radius:8px;padding:4px 7px;font-weight:bold}.meta{font-size:13px;color:#d1d5db;display:flex;gap:10px;flex-wrap:wrap}.controls{padding:14px 12px 4px;display:grid;grid-template-columns:1fr auto;gap:8px}.controls input,.controls select{border:1px solid #d1d5db;border-radius:12px;padding:12px;background:#fff;font-size:16px;color:var(--ink)}.brands{display:flex;gap:7px;overflow:auto;padding:8px 12px 12px;scrollbar-width:none}.brands button{white-space:nowrap;border:1px solid #d1d5db;background:#fff;padding:8px 12px;border-radius:999px;font-weight:700}.brands button.on{background:#111827;color:#fff;border-color:#111827}main{padding:0 12px 30px}.product{background:var(--card);border-radius:16px;margin:0 0 12px;box-shadow:0 1px 5px #00000012;overflow:hidden}.product summary{list-style:none;padding:15px;cursor:pointer;display:flex;align-items:center;gap:10px}.product summary::-webkit-details-marker{display:none}.brand{background:#fee2e2;color:#991b1b;font-size:12px;border-radius:7px;padding:4px 7px;font-weight:bold}.pname{font-weight:800;flex:1}.count{color:var(--muted);font-size:12px}.arrow{font-size:14px}.rows{border-top:1px solid var(--line);padding:6px 12px 12px}.row{display:grid;grid-template-columns:minmax(105px,1.3fr) minmax(70px,.8fr) minmax(66px,.65fr);gap:7px;align-items:center;padding:10px 3px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.store{font-weight:700;font-size:14px}.address{color:var(--muted);font-size:11px;margin-top:3px}.price{text-align:center;font-weight:800;font-size:17px}.promo{text-align:center}.promo strong{display:block;color:var(--red);font-size:17px}.promo small{display:block;color:#9f1239;font-size:10px;line-height:1.25}.dash{color:#9ca3af;text-align:center}.head{font-size:11px;color:var(--muted);font-weight:700}.source{padding:7px 3px 0;font-size:11px}.source a{color:#4b5563}.empty{background:#fff;padding:24px;border-radius:15px;text-align:center;color:var(--muted)}footer{text-align:center;color:var(--muted);font-size:11px;padding:0 20px 24px}@media(min-width:700px){.controls{grid-template-columns:1fr 220px}.row{grid-template-columns:2fr 1fr 1fr}.product summary{padding:18px}}
</style></head><body><header><div class="wrap"><h1>מחירי בירות טמפו</h1><div class="meta"><span>אזור: <select id="city" aria-label="בחירת עיר"></select></span><span id="updated">טוען נתונים…</span></div></div></header><div class="wrap"><div class="controls"><input id="q" placeholder="חיפוש מוצר, מותג או רשת"><select id="sort"><option value="brand">מיון לפי מותג</option><option value="cheap">הזול ביותר קודם</option></select></div><div class="brands" id="brands"></div><main id="app"></main><footer>מקור המחירים והמבצעים: CHP. המחיר בחנות הוא הקובע. הנתונים מתעדכנים אוטומטית מדי יום.</footer></div><script>
let data,items=[],brand='הכל';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=x=>x?`₪${Number(x).toFixed(2)}`:'—';
function min(x){let a=x.prices.flatMap(r=>[r.promoPrice,r.price]).filter(Boolean).map(Number);return a.length?Math.min(...a):9999}function renderBrands(){let bs=['הכל',...new Set(items.map(x=>x.brand))];brands.innerHTML=bs.map(b=>`<button data-b="${esc(b)}" class="${b===brand?'on':''}">${esc(b)}</button>`).join('');brands.querySelectorAll('button').forEach(x=>x.onclick=()=>{brand=x.dataset.b;renderBrands();render()})}
function render(){let t=q.value.trim().toLowerCase(),xs=items.filter(x=>(brand==='הכל'||x.brand===brand)&&(!t||[x.brand,x.name,...x.prices.flatMap(r=>[r.chain,r.store])].join(' ').toLowerCase().includes(t)));if(sort.value==='cheap')xs.sort((a,b)=>min(a)-min(b));else xs.sort((a,b)=>a.brand.localeCompare(b.brand,'he'));app.innerHTML=xs.length?xs.map(x=>`<details class="product"><summary><span class="brand">${esc(x.brand)}</span><span class="pname">${esc(x.name)}</span><span class="count">${x.prices.length?x.prices.length+' חנויות':'אין מחיר'}</span><span class="arrow">⌄</span></summary><div class="rows"><div class="row head"><span>רשת / סניף</span><span>מבצע</span><span>מחיר רגיל</span></div>${x.prices.length?x.prices.map(r=>`<div class="row"><div><div class="store">${esc(r.chain)} · ${esc(r.store)}</div><div class="address">${esc(r.address)}</div></div><div class="promo">${r.promoPrice?`<strong>${money(r.promoPrice)}</strong><small>${esc(r.promo||'מבצע פעיל')}</small>`:'<span class="dash">—</span>'}</div><div class="price">${money(r.price)}</div></div>`).join(''):'<div class="empty">— אין כרגע מחיר CHP באזור</div>'}<div class="source"><a href="${esc(x.source)}" target="_blank" rel="noopener">פתיחה במקור CHP · ברקוד ${esc(x.barcode)}</a></div></div></details>`).join(''):'<div class="empty">לא נמצאו מוצרים</div>'}
fetch('data.json?v='+Date.now()).then(r=>r.json()).then(d=>{data=d;city.innerHTML=Object.keys(d.areas).map(c=>`<option>${esc(c)}</option>`).join('');city.value=d.defaultArea;items=d.areas[city.value];city.onchange=()=>{items=d.areas[city.value];brand='הכל';renderBrands();render()};updated.textContent='עודכן: '+new Date(d.updatedAt).toLocaleString('he-IL',{dateStyle:'short',timeStyle:'short',timeZone:'Asia/Jerusalem'});renderBrands();render()}).catch(()=>updated.textContent='לא ניתן לטעון נתונים');q.oninput=render;sort.onchange=render;
</script></body></html>
